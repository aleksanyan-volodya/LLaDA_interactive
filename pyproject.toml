[project]
name = "llada-interactive"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Pinned to the versions preinstalled on Kaggle (checked 2026-10-06).
dependencies = [
    "torch==2.11.0",
    "numpy==2.1.3",
    "tokenizers==0.23.1",
    "huggingface-hub",
    "streamlit>=1.65.0",
]

# Locally we use the CPU-only torch build (smaller, smoke mode runs on CPU).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
